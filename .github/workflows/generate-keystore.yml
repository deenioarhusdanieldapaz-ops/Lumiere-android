name: Generate Keystore (Run Once)

on:
  workflow_dispatch: # Permite executar manualmente no GitHub

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.jks \
            -storetype PKCS12 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias lumiere_key \
            -sigalg SHA256withRSA \
            -dname "CN=Lumiere App, OU=Desenvolvimento, O=Lumiere, L=Maputo, ST=Maputo, C=MZ" \
            -storepass ${{ secrets.TEMP_KEYSTORE_PASS }} \
            -keypass ${{ secrets.TEMP_KEYSTORE_PASS }}

      - name: Upload Keystore as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: release.jks
